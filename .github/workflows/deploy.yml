name: Deploy portfolio to GitHub Pages

# Deploys to a *project* site (dat94-03.github.io/portfolio/). The site is
# plain static HTML — no framework, no build step — so the repository root is
# uploaded as-is instead of a compiled `dist/`. Every asset path in index.html
# is relative, which is what lets it work from a sub-path.
#
# Configure Repository → Settings → Pages → Source = "GitHub Actions" once,
# and every push to `main` redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
